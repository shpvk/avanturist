services:
  postgres:
    image: postgres:17-alpine
    container_name: buildverdict_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildverdict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildverdict}
      POSTGRES_DB: ${POSTGRES_DB:-buildverdict}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5430}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c max_connections=200
               -c shared_buffers=128MB
               -c effective_cache_size=384MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildverdict} -d ${POSTGRES_DB:-buildverdict}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
