services:
  db:
      container_name: buildverdict_postgres
      image: postgres:17-alpine
      restart: always
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      ports:
        - 5433:5432
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - backend

  redis:
    container_name: buildverdict_redis
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend: