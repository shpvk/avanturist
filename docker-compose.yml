services:
  db:
      container_name: buildverdict_postgres
      image: postgres:17-alpine
      restart: always
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
      # Слушаем только localhost: контейнеры для разработки не должны торчать
      # в локальную сеть вместе с базой пользователей.
      ports:
        - 127.0.0.1:5433:5432
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - backend

  redis:
    container_name: buildverdict_redis
    image: redis:7-alpine
    restart: always
    # Без requirepass Redis пускает любого, а в нём лежат все refresh-сессии
    # (и REDIS_URI из .env всё равно приходит с паролем).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    networks:
      - backend

  mailpit:
    container_name: buildverdict_mailpit
    image: axllent/mailpit:latest
    restart: always
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend: